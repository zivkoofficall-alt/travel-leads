<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Панель Waylen</title>
<style>html,body{margin:0;height:100%;background:#0D0E10;color:#fff;font-family:-apple-system,system-ui,sans-serif}body{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:24px}p{color:#8b8f97;font-size:15px;margin:0}a{display:inline-block;background:#C8F27B;color:#0D0E10;font-weight:800;padding:14px 22px;border-radius:999px;text-decoration:none;font-size:15px}</style></head>
<body>
<p id="m">Открываем панель…</p>
<a id="b" href="https://t.me/agentwaylenbot?startapp=panel" style="display:none">Открыть панель</a>
<script>
var LINK = 'https://t.me/agentwaylenbot?startapp=panel', done = false;
function go() { if (done)
    return; done = true; var W = window.Telegram && window.Telegram.WebApp; try {
    if (W && W.openTelegramLink) {
        W.openTelegramLink(LINK);
        setTimeout(function () { try {
            W.close();
        }
        catch (e) { } }, 600);
        return;
    }
}
catch (e) { } location.href = LINK; }
setTimeout(function () { document.getElementById('b').style.display = 'inline-block'; document.getElementById('m').textContent = 'Если панель не открылась сама:'; }, 2500);
</script>
<script src="https://telegram.org/js/telegram-web-app.js" onload="go()" onerror="go()"></script>
</body></html>
